name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # @nazr/api is Go: the go job lints, tests and builds it (this job has no Go toolchain).
      - run: pnpm lint --filter='!@nazr/api'
      - run: pnpm lint:biome
      - run: pnpm typecheck --filter='!@nazr/api'
      - run: pnpm test --filter='!@nazr/api'
      - run: pnpm build --filter='!@nazr/api'
      - uses: actions/upload-artifact@v4
        with:
          name: demo-dist
          path: apps/demo/dist
          if-no-files-found: error

  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: nazr
          POSTGRES_PASSWORD: nazr
          POSTGRES_DB: nazr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nazr -d nazr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NAZR_TEST_REQUIRE_DB: "1"
      NAZR_TEST_DATABASE_URL: postgres://nazr:nazr@localhost:5432/nazr?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nazr/api lint
      - run: go test -race ./...
        working-directory: apps/api

  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nazr/thumbmark fixtures
      - name: Fixtures are up to date
        run: git diff --exit-code apps/api/testdata/fixtures

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose -f deploy/compose/docker-compose.yml up -d --build
      - name: Smoke test
        env:
          # Keep the stack so the logs step has something to show; Tear down cleans up.
          KEEP: "1"
        run: bash deploy/compose/smoke.sh
      - name: Compose logs on failure
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.yml --profile redis logs --no-color || true
      - name: Tear down
        if: always()
        run: docker compose -f deploy/compose/docker-compose.yml --profile redis --profile dev down -v || true

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: nazr
          POSTGRES_PASSWORD: nazr
          POSTGRES_DB: nazr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nazr -d nazr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NAZR_E2E_DATABASE_URL: postgres://nazr:nazr@localhost:5432/nazr?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nazr/thumbmark build
      - run: pnpm build --filter=@nazr/widget
      - run: pnpm --filter @nazr/demo build
      - run: pnpm --filter @nazr/api build
      - run: pnpm --filter @nazr/demo exec playwright install --with-deps chromium
      - run: pnpm --filter @nazr/demo test:e2e
      # Only the obfuscation spec: the package's other e2e specs call a live
      # third-party API.
      - name: Obfuscated UMD bundle
        working-directory: packages/thumbmark
        run: |
          bash scripts/make-testpage.sh
          pnpm exec playwright test e2e/obfuscated-umd.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-test-results
          path: |
            apps/demo/test-results
            packages/thumbmark/test-results
          if-no-files-found: ignore

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.x
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.65.0
      - name: Format
        run: terraform fmt -check -recursive deploy/terraform
      - name: Validate
        run: |
          set -euo pipefail
          for dir in deploy/terraform/aws deploy/terraform/aws/examples/minimal deploy/terraform/aws/examples/existing-vpc; do
            echo "::group::validate $dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tflint --init --chdir=deploy/terraform/aws
          tflint --chdir=deploy/terraform/aws --recursive --config "$GITHUB_WORKSPACE/deploy/terraform/aws/.tflint.hcl"
